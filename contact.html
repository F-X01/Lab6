<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Italian Reminiscence</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <header>
        <nav class="navbar md:navbar-expand site-navbar" aria-label="Main navigation">
            <div class="container">
                <a class="navbar-brand" href="index.html">Italian Reminiscence</a>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                    data-bs-target="#site-menu" aria-controls="site-menu" aria-label="Open menu">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>

                <dialog class="drawer drawer-end" id="site-menu" aria-labelledby="menu-title">
                    <div class="drawer-header">
                        <span class="drawer-title" id="menu-title">Menu</span>
                        <button class="btn-close" type="button" data-bs-dismiss="drawer"
                            aria-label="Close menu"></button>
                    </div>
                    <div class="drawer-body">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="index.html#places">Places</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="contact.html" aria-current="page">Contact</a>
                            </li>
                        </ul>
                    </div>
                </dialog>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <h1>Contact</h1>

        <form action="contact.html" method="get">
            <div class="row g-4">
                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label class="form-label" for="first-name">First name</label>
                        <input class="form-control" type="text" id="first-name" required>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label class="form-label" for="last-name">Last name</label>
                        <input class="form-control" type="text" id="last-name" required>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email" id="email"
                            placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label class="form-label" for="topic">Topic</label>
                        <select class="form-control" id="topic" required>
                            <option value="">Choose a topic</option>
                            <option value="photos">Photo Questions</option>
                            <option value="tips">Travel Tips</option>
                            <option value="cities">City Recommendations</option>
                        </select>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <label class="form-label" for="message">Message</label>
                        <textarea class="form-control" id="message" rows="4" required></textarea>
                    </div>
                </div>

                <div class="col-12 md:col-6">
                    <div class="form-field">
                        <input class="check" type="checkbox" id="consent" required>
                        <label for="consent">I agree to be contacted.</label>
                    </div>
                </div>
            </div>

            <button class="btn-solid theme-primary mt-4" type="submit">Submit</button>
        </form>
    </main>

    <footer class="site-footer py-3 text-center">
        <p class="mb-0">Italian Reminiscence</p>
    </footer>
</body>
</html>
